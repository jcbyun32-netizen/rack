function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const $ = id => document.getElementById(id);
function ask(msg, okText, cancelText){
  okText = okText || '확인';
  return new Promise(res=>{
    const d = document.createElement('div');
    d.className = 'fixed inset-0 z-50 flex items-center justify-center p-6';
    d.style.background = 'rgba(0,0,0,.5)';
    d.innerHTML = '<div class="bg-white rounded-2xl p-5 w-full max-w-sm shadow-xl"><p class="whitespace-pre-line font-semibold mb-4"></p><div class="flex gap-2"></div></div>';
    d.querySelector('p').textContent = msg;
    const row = d.querySelector('div div');
    const done = v => { d.remove(); res(v); };
    if(cancelText !== null){
      const c = document.createElement('button');
      c.className = 'flex-1 h-12 rounded-xl bg-slate-200 font-bold';
      c.textContent = cancelText || '취소';
      c.onclick = () => done(false);
      row.appendChild(c);
    }
    const o = document.createElement('button');
    o.className = 'flex-1 h-12 rounded-xl text-white font-bold';
    o.style.background = 'var(--brand)';
    o.textContent = okText;
    o.onclick = () => done(true);
    row.appendChild(o);
    document.body.appendChild(d);
  });
}
function tell(msg){ return ask(msg, '확인', null); }
const serial = () => S.prefix + '-' + S.rest.trim();
const loc = i => ({ k:Math.floor(i/PER), m:Math.floor((i%PER)/28), s:Math.floor((i%28)/14), c:i%14 });
const idx = (k,m,s,c) => k*PER + m*28 + s*14 + c;
const doneCount = k => (k===undefined ? S.data : S.data.slice(k*PER,(k+1)*PER)).filter(v=>v!==null).length;
const fmt = v => v===null ? '' : (v>0 ? '+'+v : String(v));
const pcolor = k => k===0 ? 'var(--ink)' : 'var(--brand)';

function render(){
  $('resetBtn').classList.toggle('hidden', S.screen==='start');
  if(S.screen==='start') return renderStart();
  if(S.screen==='inspect') return renderInspect();
  renderReview();
}

/* ---------- 시작 화면 ---------- */
function renderStart(){
  const resume = doneCount()>0;
  $('app').innerHTML = `
  <section class="bg-white rounded-2xl p-5 shadow-sm">
    <h1 class="text-xl font-extrabold mb-1">수평 검사</h1>
    <p class="text-sm text-slate-500 mb-5">시리얼 넘버를 입력하고 검사를 시작하세요.</p>
    <div class="text-sm font-bold mb-2">시리얼 접두사</div>
    <div class="grid grid-cols-2 gap-3 mb-5">
      ${['905','907'].map(p=>`<button onclick="setPrefix('${p}')" class="h-16 rounded-xl text-2xl font-extrabold border-2 ${S.prefix===p?'text-white border-transparent':'bg-white text-slate-500 border-slate-300'}" style="${S.prefix===p?'background:var(--brand)':''}">${p}</button>`).join('')}
    </div>
    <label class="text-sm font-bold block mb-2" for="rest">나머지 시리얼 번호</label>
    <div class="flex items-center gap-2 mb-6">
      <span class="text-2xl font-extrabold">${S.prefix}-</span>
      <input id="rest" type="text" value="${S.rest.replace(/"/g,'&quot;')}" autocomplete="off" autocapitalize="characters" placeholder="예: 12345" class="flex-1 min-w-0 h-14 px-3 text-xl rounded-xl border-2 border-slate-300 focus:outline-none focus:border-emerald-500" oninput="S.rest=this.value.toUpperCase();this.value=S.rest;save()">
    </div>
    <button onclick="startInspect()" class="w-full h-16 rounded-xl text-white text-xl font-extrabold" style="background:var(--brand)">검사 시작</button>
    <p id="err" class="text-red-600 text-sm font-semibold mt-3 hidden">나머지 시리얼 번호를 입력해 주세요.</p>
  </section>
  ${resume?`<section class="bg-white rounded-2xl p-5 shadow-sm mt-4">
    <div class="font-bold mb-1">진행 중인 검사가 있습니다</div>
    <div class="text-sm text-slate-500 mb-3">${serial()} · ${doneCount()}/${TOTAL}칸 입력됨</div>
    <button onclick="S.screen='inspect';save();render()" class="w-full h-12 rounded-xl font-bold bg-slate-700 text-white">이어서 검사</button>
  </section>`:''}`;
}
function setPrefix(p){ S.prefix=p; save(); renderStart(); }
async function startInspect(){
  if(!S.rest.trim()){ $('err').classList.remove('hidden'); $('rest').focus(); return; }
  if(doneCount()>0 && !(await ask('이전에 입력한 검사 데이터가 있습니다.\n새로 시작하면 지워집니다. 계속할까요?','새로 시작'))) return;
  S.data = Array(TOTAL).fill(null); S.pos = 0; S.screen='inspect'; save(); render(); window.scrollTo(0,0);
}

/* ---------- 검사 입력 화면 ---------- */
function renderInspect(){
  const {k,m,s,c} = loc(S.pos);
  const cur = S.data[S.pos];
  const pct = Math.round(doneCount()/TOTAL*100);
  let ptabs='';
  for(let p=0;p<PHASES.length;p++){
    const on = p===k;
    ptabs += `<button onclick="goPhase(${p})" class="rounded-xl py-2 text-sm font-extrabold leading-tight ${on?'text-white':'bg-white text-slate-600'}" style="${on?'background:'+pcolor(p):''}">${p+1}단계 ${PHASES[p]}<br><span class="text-xs font-bold ${on?'text-white/80':'text-slate-400'}">${doneCount(p)}/${PER}</span></button>`;
  }
  let tabs='';
  for(let mm=0;mm<3;mm++) for(let ss=0;ss<2;ss++){
    const base = idx(k,mm,ss,0);
    const n = S.data.slice(base,base+14).filter(v=>v!==null).length;
    const on = mm===m && ss===s;
    tabs += `<button onclick="goSection(${k},${mm},${ss})" class="rounded-lg py-2 text-xs font-bold leading-tight ${on?'text-white':'bg-white text-slate-600'}" style="${on?'background:var(--ink)':''}">M${mm+1} ${SIDES[ss]}<br><span class="${on?'text-emerald-300':n===14?'text-emerald-600':'text-slate-400'}">${n}/14</span></button>`;
  }
  let cells='';
  for(let i=0;i<14;i++){
    const v = S.data[idx(k,m,s,i)];
    cells += `<button onclick="jump(${idx(k,m,s,i)})" class="h-14 rounded-lg border text-center ${i===c?'cell-on':''} ${v===null?'bg-white border-slate-300':'border-transparent text-white'}" style="${v!==null?'background:'+VCOLOR[v]:''}"><div class="text-[11px] ${v===null?'text-slate-400':'text-white/80'}">${i+1}</div><div class="text-lg font-extrabold leading-none">${fmt(v)||'·'}</div></button>`;
  }
  $('app').innerHTML = `
  <div class="grid grid-cols-6 gap-1.5 mb-3">${tabs}</div>
  <section class="bg-white rounded-2xl p-4 shadow-sm mb-3 border-t-4" style="border-color:${pcolor(k)}">
    <div class="text-sm font-extrabold mb-1" style="color:${pcolor(k)}">${PHASES[k]}</div>
    <div class="flex items-center justify-between">
      <div class="text-3xl font-extrabold">M링크 ${m+1}</div>
      <div class="px-4 py-1 rounded-full text-white text-2xl font-extrabold" style="background:${s===0?'var(--ink)':'var(--brand)'}">${SIDES[s]} ${s===0?'(Left)':'(Right)'}</div>
    </div>
    <div class="flex items-end justify-between mt-2">
      <div><span class="text-6xl font-black" style="color:${pcolor(k)}">${c+1}</span><span class="text-2xl font-bold ml-1">번 칸</span></div>
      <div class="text-right text-sm text-slate-500">현재값<div class="text-3xl font-extrabold text-slate-800">${cur===null?'-':fmt(cur)}</div></div>
    </div>
    <div class="h-2 bg-slate-200 rounded-full mt-3 overflow-hidden"><div class="h-full" style="width:${pct}%;background:var(--brand)"></div></div>
    <div class="text-xs text-slate-500 mt-1 text-right">전체 ${doneCount()}/${TOTAL}칸 · ${serial()}</div>
  </section>
  <div class="grid grid-cols-5 gap-2 mb-4">
    ${VALS.map(v=>`<button class="vbtn" style="background:${VCOLOR[v]}" onclick="setVal(${v})">${v>0?'+'+v:v}</button>`).join('')}
  </div>
  <div class="grid grid-cols-7 gap-1.5 mb-4">${cells}</div>
  <div class="grid grid-cols-3 gap-2">
    <button onclick="prev()" class="h-14 rounded-xl bg-white border-2 border-slate-300 font-bold">◀ 이전 칸</button>
    <button onclick="next()" class="h-14 rounded-xl bg-white border-2 border-slate-300 font-bold">건너뛰기 ▶</button>
    <button onclick="S.screen='review';save();render();window.scrollTo(0,0)" class="h-14 rounded-xl text-white font-bold" style="background:var(--ink)">결과 보기</button>
  </div>`;
}
function vib(){ try{ navigator.vibrate && navigator.vibrate(15); }catch(e){} }
function setVal(v){ S.data[S.pos] = v; vib(); advance(); }
function advance(){
  const was = S.pos;
  if(S.pos < TOTAL-1){ S.pos++; }
  else {
    const e = S.data.findIndex(x=>x===null);
    if(e>=0) S.pos = e; else { S.screen='review'; window.scrollTo(0,0); }
  }
  save(); render();
}
function next(){ if(S.pos<TOTAL-1){ S.pos++; save(); render(); } }
function prev(){ if(S.pos>0){ S.pos--; save(); render(); } }
function jump(i){ S.pos=i; save(); render(); }
function goPhase(p){
  const b = p*PER, e = S.data.slice(b,b+PER).findIndex(x=>x===null);
  S.pos = b + (e>=0?e:0); save(); render();
}
function goSection(k,m,s){
  const base = idx(k,m,s,0), e = S.data.slice(base,base+14).findIndex(x=>x===null);
  S.pos = base + (e>=0?e:0); save(); render();
}

/* ---------- 최종 확인 화면 ---------- */
function reviewTable(k){
  let head = '<th class="p-1 text-xs">칸</th>';
  for(let m=0;m<3;m++) for(let s=0;s<2;s++) head += `<th class="p-1 text-[11px] leading-tight">M${m+1}<br>${SIDES[s]}</th>`;
  let rows='';
  for(let c=0;c<14;c++){
    rows += `<tr><td class="p-1 text-center text-xs font-bold text-slate-500">${c+1}</td>`;
    for(let m=0;m<3;m++) for(let s=0;s<2;s++){
      const i = idx(k,m,s,c), v = S.data[i];
      rows += `<td class="p-0.5"><button onclick="editCell(${i})" class="w-full h-10 rounded-md font-extrabold ${v===null?'bg-slate-100 text-slate-300 border border-dashed border-slate-300':'text-white'}" style="${v!==null?'background:'+VCOLOR[v]:''}">${v===null?'·':fmt(v)}</button></td>`;
    }
    rows += '</tr>';
  }
  return `<section class="bg-white rounded-2xl p-2 shadow-sm mb-3">
    <div class="px-1 pt-1 pb-2 font-extrabold" style="color:${pcolor(k)}">${PHASES[k]} <span class="text-sm text-slate-500 font-bold">${doneCount(k)}/${PER}</span></div>
    <table class="w-full table-fixed"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>
  </section>`;
}
function renderReview(){
  const missing = TOTAL - doneCount();
  $('app').innerHTML = `
  <section class="bg-white rounded-2xl p-4 shadow-sm mb-3">
    <div class="text-sm text-slate-500">시리얼 넘버</div>
    <div class="text-2xl font-extrabold">${serial()}</div>
    <div class="mt-2 text-sm font-bold ${missing?'text-orange-600':'text-emerald-600'}">${missing?`미입력 ${missing}칸이 있습니다. 칸을 눌러 입력하세요.`:'모든 칸 입력이 완료되었습니다.'}</div>
  </section>
  ${reviewTable(0)}
  <div class="grid gap-2">
    <button onclick="downloadXlsx()" class="h-16 rounded-xl text-white text-lg font-extrabold" style="background:var(--brand)">엑셀(.xlsx) 저장</button>
    <button onclick="S.screen='inspect';save();render();window.scrollTo(0,0)" class="h-12 rounded-xl bg-white border-2 border-slate-300 font-bold">검사 화면으로 돌아가기</button>
  </div>`;
}
function editCell(i){ S.pos=i; S.screen='inspect'; save(); render(); window.scrollTo(0,0); }

/* ---------- 저장 / 다운로드 ---------- */
function buildRows(k){
  const header = ['칸 번호'];
  for(let m=0;m<3;m++) for(let s=0;s<2;s++) header.push(`M링크${m+1} ${SIDES[s]}`);
  const aoa = [['시리얼 넘버', serial()], ['검사 종류', PHASES[k]], ['검사 일시', new Date().toLocaleString('ko-KR')], [], header];
  for(let c=0;c<14;c++){
    const r=[c+1];
    for(let m=0;m<3;m++) for(let s=0;s<2;s++){ const v=S.data[idx(k,m,s,c)]; r.push(v===null?'':v); }
    aoa.push(r);
  }
  return aoa;
}
const fileBase = () => serial().replace(/[\\/:*?"<>|\s]/g,'_') + '_검사결과';
async function checkMissing(){ const n=TOTAL-doneCount(); return n===0 || await ask(`미입력 ${n}칸이 있습니다. 그대로 저장할까요?`,'저장'); }
function crc32(buf){
  if(!crc32.t){ crc32.t=[]; for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; crc32.t[n]=c>>>0; } }
  let crc=0xFFFFFFFF;
  for(let i=0;i<buf.length;i++) crc = crc32.t[(crc^buf[i])&255]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}
function makeZip(files){
  const enc=new TextEncoder(), chunks=[], central=[];
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
  let offset=0;
  for(const f of files){
    const name=enc.encode(f.name), data=enc.encode(f.text), crc=crc32(data), size=data.length;
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(size),...u32(size),...u16(name.length),...u16(0)]);
    chunks.push(lh,name,data); central.push({name,crc,size,offset}); offset+=lh.length+name.length+size;
  }
  const cdStart=offset;
  for(const c of central){
    const h=new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c.crc),...u32(c.size),...u32(c.size),...u16(c.name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(c.offset)]);
    chunks.push(h,c.name); offset+=h.length+c.name.length;
  }
  chunks.push(new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(central.length),...u16(central.length),...u32(offset-cdStart),...u32(cdStart),...u16(0)]));
  return new Blob(chunks,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xe = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function sheetXml(aoa){
  const col = j => String.fromCharCode(65+j);
  let rows='';
  aoa.forEach((r,i)=>{
    let cells='';
    r.forEach((v,j)=>{
      if(v===''||v===null||v===undefined) return;
      const ref = col(j)+(i+1);
      cells += (typeof v==='number') ? `<c r="${ref}"><v>${v}</v></c>` : `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`;
    });
    rows += `<row r="${i+1}">${cells}</row>`;
  });
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols><col min="1" max="7" width="14" customWidth="1"/></cols><sheetData>'+rows+'</sheetData></worksheet>';
}
function buildXlsxBlob(){
  const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  const R='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const PK='http://schemas.openxmlformats.org/package/2006/relationships';
  const sheetCT = n => `<Override PartName="/xl/worksheets/sheet${n}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`;
  return makeZip([
    {name:'[Content_Types].xml', text:H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheetCT(1)+'</Types>'},
    {name:'_rels/.rels', text:H+`<Relationships xmlns="${PK}"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml', text:H+`<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${R}"><sheets><sheet name="수평검사" sheetId="1" r:id="rId1"/></sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels', text:H+`<Relationships xmlns="${PK}"><Relationship Id="rId1" Type="${R}/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`},
    {name:'xl/worksheets/sheet1.xml', text:sheetXml(buildRows(0))}
  ]);
}
async function downloadXlsx(){
  if(!(await checkMissing())) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(buildXlsxBlob());
  a.download = fileBase()+'.xlsx';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function resetAll(){
  if(!(await ask('현재 검사 데이터를 지우고 처음 화면으로 돌아갈까요?\n저장하지 않은 입력값은 사라집니다.','새 검사'))) return;
  S = { screen:'start', prefix:S.prefix, rest:'', data:Array(TOTAL).fill(null), pos:0 };
  save(); render(); window.scrollTo(0,0);
}

load(); render();
</script>
